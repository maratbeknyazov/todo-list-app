name: todo_list
description: A new Flutter project.
# Команда для сборки (упаковки):flutter build apk --target-platform android-arm --split-per-abi

version: 1.1.2+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.20.0"

dependencies:
  flutter:
    sdk: flutter
  # Интернационализация
  flutter_localizations:
    sdk: flutter

  # Следующая строка добавляет шрифт Cupertino Icons в ваше приложение.
  # Используйте вместе с классом CupertinoIcons для иконок в стиле iOS.
  cupertino_icons: ^1.0.8
  # Пакет локализации intl
  intl: 0.20.2
  # Сетевые запросы
  dio: ^5.9.0
  # Локальное хранилище
  shared_preferences: ^2.5.3
  # Управление состоянием
  provider: ^6.1.5
  # Виджеты прокрутки (слайдеры)
  carousel_slider: ^5.1.1
  # Кольцевой список
  circle_list: ^1.0.5
  # Локальная база данных
  sqflite: ^2.4.2
  # Окно выбора цвета (пипетка)
  flutter_colorpicker: ^1.1.0
  # Кэширование изображений
  cached_network_image: ^3.4.1
  # Выбор изображений
  image_picker: ^1.1.2
  # Запрос разрешений
  permission_handler: ^12.0.1
  # Получение путей к файлам
  path_provider: ^2.1.5
  # Обрезка изображений
  image_cropper: ^12.2.1
  # svg
  flutter_svg: ^2.2.0
  # Получение информации о пакете
  package_info_plus: ^9.0.1
  # Веб-страница (замена для flutter_webview_plugin)
  webview_flutter: ^4.13.0
  # Загрузка при прокрутке вверх (Pull-to-load)
  pull_to_refresh: ^2.0.0
  # Просмотр изображений
  photo_view: ^0.15.0
  # URL, можно использовать для открытия магазина приложений
  url_launcher: ^6.3.2
  # Открытие файлов (используется для загрузки и установки обновлений на Android)
  open_file: ^3.5.10
  # flare_flutter устарел, рекомендуется перейти на rive или lottie
  # rive: ^0.13.20
  # lottie: ^3.3.2
  # Шифрование
  encrypt: ^5.0.3
  # Анимация списков
  flutter_staggered_animations: ^1.1.1
  # Выбор с помощью прокрутки (Picker)
  wheel_chooser: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter


# Следующий раздел относится к Flutter
flutter:

  assets:
    - images/
    - images/weather/
    - local_json/
    - svgs/
    - flrs/

  # Следующая строка гарантирует, что шрифт Material Icons будет
  # включен в ваше приложение, чтобы вы могли использовать иконки из
  # класса Material Icons.
  uses-material-design: true

  # Чтобы добавить ассеты (ресурсы) в ваше приложение, добавьте раздел assets, например так:
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg

  # Ассет изображения может ссылаться на один или несколько «вариантов» с разным разрешением, см.
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # Для получения подробной информации о добавлении ассетов из зависимостей пакетов см.
  # https://flutter.dev/assets-and-images/#from-packages

  # Чтобы добавить пользовательские шрифты в ваше приложение, добавьте раздел fonts здесь,
  # в этом разделе "flutter". Каждая запись в этом списке должна иметь
  # ключ "family" с названием семейства шрифтов и ключ "fonts" со
  # списком, указывающим на ассет и другие дескрипторы шрифта. На
  # пример:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

